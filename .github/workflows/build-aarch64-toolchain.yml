name: Build toolchain

on:
  workflow_call:
    inputs:
      PROJECT:
        required: true
        type: string
      DEVICE:
        required: true
        type: string
      OWNER_LC:
        required: true
        type: string
    outputs:
      cache-hit:
        description: "Whether the aarch64 toolchain build tree was restored from cache"
        value: ${{ jobs.build-aarch64-toolchain.outputs.cache-hit }}

jobs:
  build-aarch64-toolchain:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    env:
      JAVA_HOME: /usr
      AUTOREMOVE: "yes"
      AUTOREMOVE_BLOCK: "gcc glibc libtool flex"
      PROJECT: ${{ inputs.PROJECT }}
      DEVICE: ${{ inputs.DEVICE }}
      ARCH: aarch64
      DISABLE_COLORS: yes
      CCACHE_COMPILERCHECK: content
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      PACKAGE_LIST: "toolchain alsa-lib llvm:host"
    outputs:
      cache-hit: ${{ steps.restore-toolchain.outputs.hit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Compute a hash of all the package.mk, *.patch, and *.conf files in the toolchain dependency tree. 
      # This is used to determine whether we can restore a previous build from cache.
      - name: Compute toolchain dependency hash
        id: hash
        run: |
          export PROJECT DEVICE ARCH=aarch64
          OUT=$(bash tools/list_deps.sh ${PACKAGE_LIST})
          PKG_DIRS=$(echo "$OUT" | sed -n '1,/---WATCH---/p' | grep -v '^---WATCH---$')
          WATCH_PATHS=$(echo "$OUT" | sed -n '/---WATCH---/,$p' | grep -v '^---WATCH---$')

          HASH=$({
            for d in $PKG_DIRS; do
              find "$d" -type f \( -name 'package.mk' -o -name '*.patch' -o -name '*.conf' \)
            done
            for d in $WATCH_PATHS; do
              find "$d" -type f
            done
          } | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)

          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # Try to restore the whole toolchain/build tree from a previous run first.
      # On a hit, Build and everything that only makes sense post-build is skipped.
      - name: Retrieve toolchain build tree
        id: restore-toolchain
        run: |
          HASH=${{ steps.hash.outputs.hash }}
          BASE="toolchain-aarch64-${{ inputs.DEVICE }}-${HASH}"
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/toolchain/${BASE}.tar.zst"
          SUMURL="${URL}.sha256"

          if curl -L --fail --silent -o "${BASE}.tar.zst" "$URL" && curl -L --fail --silent -o "${BASE}.tar.zst.sha256" "$SUMURL"; then
            if sha256sum -c "${BASE}.tar.zst.sha256"; then
              tar --zstd -xf "${BASE}.tar.zst"
              echo "hit=true" >> "$GITHUB_OUTPUT"
              echo "Restored full toolchain tree for hash $HASH — skipping build"
            else
              echo "::warning::Checksum mismatch on toolchain tree, discarding"
              echo "hit=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No exact-match toolchain tree for $HASH"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Maximize build space
        if: steps.restore-toolchain.outputs.hit != 'true'
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine

      - name: Retrieve ccache
        if: steps.restore-toolchain.outputs.hit != 'true'
        run: |
          URL="https://github.com/${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}/releases/download/ccache/ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar"
          curl -L --fail --silent --show-error "$URL" | tar -xvf - || echo "Cache archive not found, skipping."

      - name: Build
        if: steps.restore-toolchain.outputs.hit != 'true'
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt ${PACKAGE_LIST}"; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs (${{ inputs.DEVICE }}-aarch64-toolchain)
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Build llvm:target
        if: ${{ inputs.DEVICE == 'SM8250' || inputs.DEVICE == 'SM8550' || inputs.DEVICE == 'SM8650' || inputs.DEVICE == 'SM8750' }}
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            ./scripts/get_env > .env
            set -e
            { docker run --init --env-file .env --rm --user $(id -u):$(id -g) -v ${PWD}:${PWD} -w ${PWD} "ghcr.io/${{ inputs.OWNER_LC }}/rocknix-build:latest" \
              bash -c "./scripts/build_mt llvm:target "; echo $? > docker_exit_code; } | tee output.log | grep -E  --color=never --line-buffered "^GET|^UNPACK|^BUILD|^INSTALL" || true
            exit_code=$(<docker_exit_code)
            exit $exit_code
          max_attempts: 6
          retry_interval: 10

      - name: Archive output.logs (${{ inputs.DEVICE }}-llvm)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: output.logs-${{ inputs.DEVICE }}-llvm
          path: |
            output.log
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.threads/logs/

      - name: Clean ccache
        if: steps.restore-toolchain.outputs.hit != 'true'
        run: |
          export CCACHE_DIR=./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -M 500M
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -c
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -s -v
          ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain/bin/ccache -z

      - name: Tar ccache
        if: steps.restore-toolchain.outputs.hit != 'true'
        run: |
          tar --remove-files -cf ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.ccache

      - name: Save ccache
        if: steps.restore-toolchain.outputs.hit != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          files: ccache-aarch64-${{ inputs.DEVICE }}-toolchain.tar
          make_latest: true
          prerelease: true
          body: ccache
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      - name: Tar and checksum toolchain build tree
        if: steps.restore-toolchain.outputs.hit != 'true'
        run: |
          HASH=${{ steps.hash.outputs.hash }}
          BASE="toolchain-aarch64-${{ inputs.DEVICE }}-${HASH}"
          tar --zstd -cf "${BASE}.tar.zst" \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps
          sha256sum "${BASE}.tar.zst" > "${BASE}.tar.zst.sha256"

      - name: Save toolchain build tree
        if: steps.restore-toolchain.outputs.hit != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: toolchain
          files: |
            toolchain-aarch64-${{ inputs.DEVICE }}-${{ steps.hash.outputs.hash }}.tar.zst
            toolchain-aarch64-${{ inputs.DEVICE }}-${{ steps.hash.outputs.hash }}.tar.zst.sha256
          make_latest: true
          prerelease: true
          body: toolchain
          token: ${{ secrets.GH_PAT }}
          repository: ${{ github.repository_owner }}/${{ vars.CACHE_REPO || 'distribution-cache' }}
        continue-on-error: true

      # Unconditional — runs whether we hit cache or built fresh, so downstream
      # jobs in THIS workflow run always have something to download.
      - name: Tar toolchain artifact for same-run consumers
        if: always()
        run: |
          tar --zstd -cf build.aarch64-toolchain.tar.zst \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/toolchain \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/build \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/install_* \
            ./build.ROCKNIX-${{ inputs.DEVICE }}.aarch64/.stamps

      - name: Upload toolchain artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aarch64-toolchain (${{ inputs.DEVICE }})
          path: build.aarch64-toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error
